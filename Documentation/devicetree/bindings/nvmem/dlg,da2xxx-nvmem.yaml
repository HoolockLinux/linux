%YAML 1.2
---
$id: http://devicetree.org/schemas/nvmem/dlg,da2xxx-nvmem.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Dialog DA2XXX PMIC NVMEM

description: |
  This module is part of Dialog DA2XXX PMICs. For more details see
  ../mfd/dlg,da2xxx.yaml.

  NVMEM cells found in Dialog DA2xxx PMICs are used to store
  information including RTC offset and boot failure count.

maintainers:
  - Nick Chan <towinchenmi@gmail.com>

allOf:
  - $ref: nvmem.yaml#

properties:
  compatible:
    const: dlg,da2xxx-nvmem

  reg:
    maxItems: 1

required:
  - compatible
  - reg

unevaluatedProperties: false
...
