%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/apple,usbx-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple USB Complex PHY

description:
  The Apple USB Complex is a PHY that is used in various lightning port
  iPhone, iPad and iPod touches. It is also used in some USB 2.0 only
  Type-C Apple devices like Apple TV HD and iBridge T2.

maintainers:
  - Nick Chan <towinchenmi@gmail.com>

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - apple,s5l8960x-usbx-phy
              - apple,t8011-usbx-phy
              - apple,t8015-usbx-phy
      - items:
          - enum:
              - apple,t7000-usbx-phy
              - apple,s8000-usbx-phy
              - apple,t8010-usbx-phy
          - const: apple,s5l8960x-usbx-phy

  reg:
    maxItems: 2

  reg-names:
    items:
      - const: core
      - const: otg

  power-domains:
    description: |
        Power domains for the PHY. Typically consists of two domains, one
        for the whole PHY and the other for some control registers.
    maxItems: 2

  mode-switch: true

  "#phy-cells":
    const: 0

  "#reset-cells":
    const: 0

required:
  - compatible
  - reg
  - reg-names
  - '#phy-cells'
  - '#reset-cells'

additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        phy@230000000 {
            compatible = "apple,t8015-usbx-phy";
            reg = <0x2 0x30000000 0x0 0x100>,
                  <0x2 0x30000060 0x0 0x20>;
            reg-names = "core", "otg";
            mode-switch;
            #phy-cells = <0>;
            #reset-cells = <0>;
        };
    };
