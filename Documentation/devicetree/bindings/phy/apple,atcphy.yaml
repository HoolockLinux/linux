%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/apple,atcphy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple Type-C PHY (ATCPHY)

maintainers:
  - Sven Peter <sven@svenpeter.dev>

description:
  The Apple Type-C PHY (ATCPHY) is a PHY for USB 2.0, USB 3.x,
  USB4/Thunderbolt, and DisplayPort connectivity found in Apple Silicon SoCs.

  The PHY handles muxing between these different protocols and also provides the
  reset controller for the attached dwc3 USB controller.

  The PHY is designed for USB4 operation and does not handle individual
  differential pairs as distinct DisplayPort lanes. Any reference to lane in
  this binding hence refers to two differential pairs (RX and TX) as used in USB
  terminology.

properties:
  compatible:
    enum:
      - apple,t6000-atcphy
      - apple,t6000-atcphy-dp-only # PHY hardwired to DP-to-HDMI converter on M2 Pro MacBook
      - apple,t6020-atcphy
      - apple,t8103-atcphy
      - apple,t8103-atcphy-capcode-workaround # M1 PHY with additional hardware quirk
      - apple,t8112-atcphy

  reg:
    minItems: 6
    maxItems: 6

  reg-names:
    items:
      - const: core
      - const: lpdptx
      - const: axi2af
      - const: usb2phy
      - const: pipehandler
      - const: usb4pmgr

  "#phy-cells":
    const: 1

  "#reset-cells":
    const: 0

  nvmem-cells:
    minItems: 9
    maxItems: 10
    description: |
      References to nvmem cells for PHY calibration values containing
      factory-programmed values.

      cio3pll_dll_start_capcode_workaround is optional and only required for
      one of the two PHYs preset on t8103 (M1). Starting with t6020 (M2 Pro)
      these calibration values are no longer required and presumably applied
      either directly in hardware or by iBoot before we get control.

  nvmem-cell-names:
    minItems: 9
    maxItems: 10
    items:
      - const: aus_cmn_shm_vreg_trim
      - const: auspll_rodco_encap
      - const: auspll_rodco_bias_adjust
      - const: auspll_fracn_dll_start_capcode
      - const: auspll_dtc_vreg_adjust
      - const: cio3pll_dco_coarsebin0
      - const: cio3pll_dco_coarsebin1
      - const: cio3pll_dll_start_capcode
      - const: cio3pll_dtc_vreg_adjust
      - const: cio3pll_dll_start_capcode_workaround

  orientation-switch:
    type: boolean
    description:
      The PHY handles swapping lanes if the Type-C connector is flipped.

  mode-switch:
    type: boolean
    description:
      The PHY handles muxing between USB 2.0, USB 3.x, USB4/Thunderbolt, and DisplayPort.

  power-domains:
    minItems: 1
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/properties/port
    description:
      This port is used to connect the PHY to the Type-C port and represents
      the two SS RX/TX pairs.

  apple,tunable-axi2af:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description:
      AXI2AF tunables.

      This array is filled with 3-tuples each containing three 32-bit values
      <register offset>, <mask>, and <value> by the bootloader.
      The driver will use these to configure the PHY by reading from each
      register, ANDing it with <mask>, ORing it with <value>, and storing the
      result back to the register.
      These values slightly differ even between different chips of the same
      generation and are likely calibration values determined by Apple at
      manufacturing time.

  apple,tunable-common:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description:
      common tunables required for all modes, see apple,tunable-axi2af for details.

  apple,tunable-lane0-usb:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description:
      USB tunables on lane 0, see apple,tunable-axi2af for details.

  apple,tunable-lane1-usb:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description:
      USB tunables on lane 1, see apple,tunable-axi2af for details.

  apple,tunable-lane0-cio:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description:
      USB4/Thunderbolt ("converged IO") tunables on lane 0, see apple,tunable-axi2af for details.

  apple,tunable-lane1-cio:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description:
      USB4/Thunderbolt ("converged IO") tunables on lane 1, see apple,tunable-axi2af for details.

  apple,tunable-lane0-dp:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description:
      DisplayPort tunables on lane 0, see apple,tunable-axi2af for details.

      Note that lane here refers to a USB RX and TX pair re-used for DisplayPort
      and not to an individual DisplayPort differential lane.

  apple,tunable-lane1-dp:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description:
      DisplayPort tunables on lane 1, see apple,tunable-axi2af for details.

      Note that lane here refers to a USB RX and TX pair re-used for DisplayPort
      and not to an individual DisplayPort differential lane.

required:
  - compatible
  - reg
  - reg-names
  - "#phy-cells"
  - "#reset-cells"
  - orientation-switch
  - mode-switch

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - apple,t6000-atcphy
              - apple,t6000-atcphy-dp-only
              - apple,t8103-atcphy
              - apple,t8112-atcphy
    then:
      properties:
        nvmem-cells:
          maxItems: 9
        nvmem-cell-names:
          maxItems: 9
  - if:
      properties:
        compatible:
          contains:
            enum:
              - apple,t8103-atcphy-capcode-workaround
    then:
      properties:
        nvmem-cells:
          minItems: 10
        nvmem-cell-names:
          minItems: 10
  - if:
      properties:
        compatible:
          contains:
            enum:
              - apple,t6020-atcphy
    then:
      properties:
        nvmem-cells: false
        nvmem-cell-names: false

additionalProperties: false

examples:
  - |
    phy@383000000 {
        compatible = "apple,t8103-atcphy";
        reg = <0x3 0x83000000 0x0 0x4c000>,
              <0x3 0x83050000 0x0 0x8000>,
              <0x3 0x80000000 0x0 0x4000>,
              <0x3 0x82a90000 0x0 0x4000>,
              <0x3 0x82a84000 0x0 0x4000>,
              <0x2 0x3b784000 0x0 0x4000>;
        reg-names = "core", "lpdptx", "axi2af", "usb2phy",
                    "pipehandler", "usb4pmgr";

        #phy-cells = <1>;
        #reset-cells = <0>;

        nvmem-cells = <&atcphy0_aus_cmn_shm_vreg_trim>,
                      <&atcphy0_auspll_rodco_encap>,
                      <&atcphy0_auspll_rodco_bias_adjust>,
                      <&atcphy0_auspll_fracn_dll_start_capcode>,
                      <&atcphy0_auspll_dtc_vreg_adjust>,
                      <&atcphy0_cio3pll_dco_coarsebin0>,
                      <&atcphy0_cio3pll_dco_coarsebin1>,
                      <&atcphy0_cio3pll_dll_start_capcode>,
                      <&atcphy0_cio3pll_dtc_vreg_adjust>;
        nvmem-cell-names = "aus_cmn_shm_vreg_trim",
                           "auspll_rodco_encap",
                           "auspll_rodco_bias_adjust",
                           "auspll_fracn_dll_start_capcode",
                           "auspll_dtc_vreg_adjust",
                           "cio3pll_dco_coarsebin0",
                           "cio3pll_dco_coarsebin1",
                           "cio3pll_dll_start_capcode",
                           "cio3pll_dtc_vreg_adjust";

        orientation-switch;
        mode-switch;
        power-domains = <&ps_atc0_usb>;
    };
  - |
    phy@383000000 {
        compatible = "apple,t6020-atcphy";
        reg = <0x3 0x83000000 0x0 0x4c000>,
              <0x3 0x83050000 0x0 0x8000>,
              <0x3 0x80000000 0x0 0x4000>,
              <0x3 0x82a90000 0x0 0x4000>,
              <0x3 0x82a84000 0x0 0x4000>,
              <0x2 0x3b784000 0x0 0x4000>;
        reg-names = "core", "lpdptx", "axi2af", "usb2phy",
                    "pipehandler", "usb4pmgr";

        #phy-cells = <1>;
        #reset-cells = <0>;

        orientation-switch;
        mode-switch;
        power-domains = <&ps_atc0_usb>;
    };
