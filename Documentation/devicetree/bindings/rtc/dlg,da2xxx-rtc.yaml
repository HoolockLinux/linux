%YAML 1.2
---
$id: http://devicetree.org/schemas/rtc/dlg,da2xxx-rtc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Dialog DA2xxx PMIC RTC device

maintainers:
  - Nick Chan <towinchenmi@gmail.com>

description:
  This module is part of Dialog DA2xxx PMICs. For more details
  see ../mfd/dlg,da2xxx.yaml.

  An RTC device that consist of an immutable counter that could count a
  limited amount of time, coupled with an nvmem cell to store the rest of the
  time.

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - dlg,da2089-rtc
              - dlg,da2186-rtc
              - dlg,da2207-rtc
          - const: dlg,da2045-rtc
      - items:
          - enum:
              - dlg,da2257-rtc
              - dlg,da2333-rtc
              - dlg,da2365-rtc
              - dlg,da2400-rtc
              - dlg,da2422-rtc
              - dlg,da2449-rtc
          - const: dlg,da2255-rtc
      - const: dlg,da2045-rtc
      - const: dlg,da2255-rtc


  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  nvmem-cells:
    items:
      - description:
          four-byte nvmem cell holding a little-endian offset from the Unix
          epoch which represent most of the time that the immutable counter
          cannot represent.

  nvmem-cell-names:
    items:
      - const: rtc_offset

  wakeup-source: true

required:
  - compatible
  - reg

additionalProperties: false
...
