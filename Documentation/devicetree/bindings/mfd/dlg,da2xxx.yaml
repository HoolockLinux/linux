---
$id: http://devicetree.org/schemas/mfd/dlg,da2xxx.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Dialog DA2XXX PMICs

maintainers:
  - Nick Chan <towinchenmi@gmail.com>

description: |
  Apple SoCs came with PMICs designed by Dialog Semiconductor before
  Apple switched to their own PMIC designs. On A7 - A10X SoCs, they
  are attached over I2C. On A11 and T2 the PMIC is attached via SPMI
  instead. The parts used by Apple appears to be quite different
  from public parts offered by Dialog. This binding describes simple
  MFD - I2C/SPMI device with 16-bit register address and 8-bit values
  that allows subdevices like RTC, power-off control and backlight to
  be described.

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - dlg,da2045
              - dlg,da2089
              - dlg,da2186
              - dlg,da2207
              - dlg,da2255
              - dlg,da2257
              - dlg,da2333
              - dlg,da2365
              - dlg,da2400
              - dlg,da2401
          - const: dlg,i2c-da2xxx
      - items:
          - enum:
              - dlg,da2422
              - dlg,da2449
          - const: dlg,spmi-da2xxx

  reg:
    maxItems: 1

  "#address-cells":
    const: 1

  "#size-cells":
    const: 1

patternProperties:
  "^backlight(@[0-9a-f]+)?$":
    $ref: /schemas/leds/backlight/dlg,da2xxx-bl.yaml

  "^rtc(@[0-9a-f]+)?$":
    $ref: /schemas/rtc/dlg,da2xxx-rtc.yaml

  "^nvmem(@[0-9a-f]+)?$":
    $ref: /schemas/nvmem/dlg,da2xxx-nvmem.yaml

required:
  - compatible
  - reg
  - "#address-cells"
  - "#size-cells"

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pmic@3c {
            compatible = "dlg,da2207", "dlg,i2c-da2xxx";
            reg = <0x3c>;
            #address-cells = <1>;
            #size-cells = <1>;

            rtc@500 {
                compatible = "dlg,da2207-rtc", "dlg,da2045-rtc";
                reg = <0x500 0x10>;
                nvmem-cells = <&rtc_offset_0>;
                nvmem-cell-names = "rtc_offset";
            };

            backlight@600 {
                compatible = "dlg,da2207-bl", "dlg,da2089-bl";
                reg = <0x600 0x2>;
            };

            nvmem@4000 {
                compatible = "dlg,da2xxx-nvmem";
                reg = <0x4000 0x28>;

                nvmem-layout {
                    compatible = "fixed-layout";
                    #address-cells = <1>;
                    #size-cells = <1>;

                    rtc_offset_0: rtc-offset@4 {
                        reg = <0x4 0x4>;
                    };
                };
            };
        };
    };

  - |

    #include <dt-bindings/spmi/spmi.h>

    spmi {
        #address-cells = <2>;
        #size-cells = <0>;

        pmic@f {
            compatible = "dlg,da2422", "dlg,spmi-da2xxx";
            reg = <0xf SPMI_USID>;
            #address-cells = <1>;
            #size-cells = <1>;

            rtc@1400 {
                compatible = "dlg,da2422-rtc", "dlg,da2255-rtc";
                reg = <0x1400 0x10>;
                nvmem-cells = <&rtc_offset_1>;
                nvmem-cell-names = "rtc_offset";
            };

            nvmem@6000 {
                compatible = "dlg,da2xxx-nvmem";
                reg = <0x6000 0x300>;

                nvmem-layout {
                    compatible = "fixed-layout";
                    #address-cells = <1>;
                    #size-cells = <1>;

                    rtc_offset_1: rtc-offset@4 {
                        reg = <0x4 0x4>;
                    };
                };
            };
        };
    };
