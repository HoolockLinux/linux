%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/dlg,i2c-da2xxx.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Dialog DA2XXX PMICs over I2C in Apple Products

maintainers:
  - Nick Chan <towinchenmi@gmail.com>

description: |
  Apple SoCs came with PMICs designed by Dialog Semiconductor before
  Apple switched to their own PMIC designs. On A7 - A10X SoCs, they
  are attached over I2C. The parts used by Apple appears to be quite
  different from public parts offered by Dialog. This binding
  describes a simple MFD - I2C device with 16-bit register address
  and 8-bit values that allows subdevices like RTC, power-off control
  and backlight to be described.

properties:
  compatible:
    items:
      - enum:
          - dlg,da2045
          - dlg,da2089
          - dlg,da2186
          - dlg,da2207
          - dlg,da2255
          - dlg,da2257
          - dlg,da2333
          - dlg,da2365
          - dlg,da2400
          - dlg,da2401
      - const: dlg,i2c-da2xxx

  reg:
    maxItems: 1

  '#address-cells':
    const: 1

  '#size-cells':
    const: 0

patternProperties:
  "^backlight(@[0-9a-f]+)?$":
    $ref: /schemas/leds/backlight/dlg,da2xxx-bl.yaml

required:
  - compatible
  - reg
  - "#address-cells"
  - "#size-cells"

additionalProperties: false

examples:
  - |
    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      pmu@3c {
        compatible = "dlg,da2207", "dlg,i2c-da2xxx";
        reg = <0x3c>;
        #address-cells = <1>;
        #size-cells = <0>;

        backlight@600 {
          compatible = "dlg,da2207-bl", "dlg,da2089-bl";
          reg = <0x600>;
        };
      };
    };
